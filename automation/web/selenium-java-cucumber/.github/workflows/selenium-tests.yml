# =====================================================================
#  GITHUB ACTIONS - Selenium Java Cucumber Tests
# =====================================================================
#  Ejecuta los tests en cada push y pull request.
#  Publica los reportes Allure como artifacts descargables.
# =====================================================================

name: Selenium Tests

# ═══════════════════ TRIGGERS ═══════════════════
# Cuando ejecutar este workflow
on:
  push:
    branches: [ main, develop ]
    paths:
      - 'automation/web/selenium-java-cucumber/**'
      - '.github/workflows/selenium-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'automation/web/selenium-java-cucumber/**'
  workflow_dispatch:  # Permite ejecucion manual desde la UI de GitHub

# ═══════════════════ JOBS ═══════════════════
jobs:

  # ───────────────────────────────────────────────────────────────
  # JOB 1: Smoke Tests (rapidos, en cada push)
  # ───────────────────────────────────────────────────────────────
  smoke-tests:
    name: Smoke Tests (Chrome headless)
    runs-on: ubuntu-latest
    
    steps:
      # 1. Descargar el codigo del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # 2. Configurar Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      # 3. Ejecutar los smoke tests en modo headless
      - name: Run smoke tests
        working-directory: automation/web/selenium-java-cucumber
        run: mvn clean test "-Dcucumber.filter.tags=@smoke" "-Dheadless=true"
      
      # 4. Publicar reporte Allure como artifact
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-smoke
          path: automation/web/selenium-java-cucumber/target/allure-results/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────
  # JOB 2: Regression Tests (completos, en PRs a main)
  # ───────────────────────────────────────────────────────────────
  regression-tests:
    name: Regression Tests (Chrome headless)
    runs-on: ubuntu-latest
    needs: smoke-tests  # Solo corre si smoke pasa
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Run regression tests
        working-directory: automation/web/selenium-java-cucumber
        run: mvn clean test "-Dheadless=true"
      
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-regression
          path: automation/web/selenium-java-cucumber/target/allure-results/
          retention-days: 14