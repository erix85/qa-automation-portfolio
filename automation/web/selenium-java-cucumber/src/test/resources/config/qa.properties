# ═══════════════════════════════════════════════════════════════════
#  CONFIGURACIÓN QA - DemoBlaze
# ═══════════════════════════════════════════════════════════════════

# ═══════════════════ ENTORNO ═══════════════════
env.name=qa

# ═══════════════════ URLs ═══════════════════
base.url=https://www.demoblaze.com
home.path=/index.html
cart.path=/cart.html

# ═══════════════════ TIMEOUTS ═══════════════════
explicit.wait=15
page.load.timeout=30
alert.timeout=10

# ═══════════════════ BROWSER ═══════════════════
browser.default=chrome
headless.default=false

# ═══════════════════ SELENIUM GRID ═══════════════════
# Dejar vacío para modo LOCAL (driver local con WebDriverManager).
# Definir URL para modo GRID, ej: http://localhost:4444
# También se puede sobrescribir con -Dgrid.url=http://localhost:4444
grid.url=

# ═══════════════════ DOCKER COMPOSE ═══════════════════
grid.default.url=http://localhost:4444
grid.node.max.sessions=2
grid.node.shm.size=2gb